<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Vendor License Generator — Lab Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        padding: 32px 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e293b 100%);
        color: #0f172a;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        line-height: 1.5;
      }

      .card {
        width: 100%;
        max-width: 520px;
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.05);
      }

      .header {
        margin-bottom: 24px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 9999px;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        color: #047857;
        font-size: 0.725rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        color: #0f172a;
        letter-spacing: -0.5px;
      }

      .intro {
        color: #64748b;
        font-size: 0.85rem;
        margin-top: 4px;
        line-height: 1.45;
      }

      form {
        display: grid;
        gap: 14px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 5px;
        font-size: 0.8rem;
        font-weight: 650;
        color: #334155;
      }

      label[hidden] {
        display: none;
      }

      input,
      select {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #f8fafc;
        color: #0f172a;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.15s ease;
      }

      input:focus,
      select:focus {
        outline: none;
        background: #ffffff;
        border-color: #0284c7;
        box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
      }

      input[readonly] {
        background: #f1f5f9;
        color: #475569;
        cursor: not-allowed;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: #0284c7;
        color: white;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.15s ease;
      }

      button:hover {
        background: #0369a1;
        box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      }

      button:active {
        transform: scale(0.99);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      button.secondary {
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #334155;
      }

      button.secondary:hover {
        background: #f8fafc;
        border-color: #94a3b8;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      }

      .message {
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 0.825rem;
        font-weight: 600;
        margin-top: 14px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
      }

      .message.success {
        background: #ecfdf5;
        border-color: #a7f3d0;
        color: #047857;
      }

      #result {
        display: grid;
        gap: 12px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
        animation: fadeIn 0.25s ease;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .key-box {
        background: #090d16;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 14px 16px;
        text-align: center;
      }

      .key-label {
        font-size: 0.725rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #94a3b8;
        margin-bottom: 6px;
      }

      .activation-key {
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.25rem;
        font-weight: 700;
        color: #34d399;
        letter-spacing: 1.5px;
        word-break: break-all;
        background: transparent;
        border: none;
        width: 100%;
        text-align: center;
        resize: none;
        outline: none;
      }

      .note {
        font-size: 0.775rem;
        color: #475569;
        white-space: pre-line;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 12px 14px;
        line-height: 1.6;
        font-family: 'JetBrains Mono', monospace;
      }

      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      @media (max-width: 480px) {
        .card {
          padding: 24px 20px;
        }
        .grid-2,
        .btn-group {
          grid-template-columns: 1fr;
        }
        .activation-key {
          font-size: 1.05rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="header">
        <span class="badge">Vendor License Portal</span>
        <h1>Offline License Generator</h1>
        <p class="intro">Generate cryptographically signed 25-digit activation keys bound to the client's terminal ID. Zero internet required by client software.</p>
      </div>

      <form id="license-form">
        <label>
          Admin Security Password *
          <input id="admin-token" type="password" placeholder="Enter generator password" autocomplete="current-password" required>
        </label>

        <div class="grid-2">
          <label>
            Issued To (Client / Lab) *
            <input id="issued-to" type="text" placeholder="e.g. Apex Clinical Lab" maxlength="120" autocomplete="name" required>
          </label>
          <label>
            Contact (Phone / Email)
            <input id="contact" type="text" placeholder="Optional contact info" maxlength="120" autocomplete="off">
          </label>
        </div>

        <label>
          Terminal Device ID (Hardware Machine Lock) *
          <input id="device-id" type="text" placeholder="Client Terminal ID (from client Settings)" maxlength="128" autocomplete="off" required>
        </label>

        <div class="grid-2">
          <label>
            License Type
            <select id="license-type">
              <option value="new">New Activation</option>
              <option value="renewal">License Renewal</option>
            </select>
          </label>
          <label>
            License Duration
            <select id="license-duration">
              <option value="1-day">1 Day Trial</option>
              <option value="3-months">3 Months</option>
              <option value="6-months">6 Months</option>
              <option value="1-year" selected>1 Year (Annual)</option>
              <option value="custom-days">Custom Days</option>
            </select>
          </label>
        </div>

        <label id="custom-days-field" hidden>
          Custom Duration (Number of Days) *
          <input id="custom-days" type="number" min="1" step="1" placeholder="Enter days (e.g. 90)" inputmode="numeric">
        </label>

        <label>
          Calculated Expiry Date (Auto-locked)
          <input id="expires-at" type="date" readonly required>
        </label>

        <button id="generate-button" type="submit">
          Generate 25-Digit License Key
        </button>
      </form>

      <p id="message" class="message" role="alert" hidden></p>

      <section id="result" hidden>
        <div class="key-box">
          <div class="key-label">25-Digit Activation Key (Provide to User)</div>
          <textarea id="activation-key" class="activation-key" rows="1" readonly></textarea>
        </div>

        <div class="btn-group">
          <button id="copy-button" type="button">Copy 25-Digit Key</button>
          <button id="copy-details-button" class="secondary" type="button">Copy Full Summary</button>
        </div>

        <div id="expiry-note" class="note"></div>
      </section>
    </main>

    <script>
      const form = document.querySelector('#license-form');
      const adminToken = document.querySelector('#admin-token');
      const issuedTo = document.querySelector('#issued-to');
      const contact = document.querySelector('#contact');
      const deviceId = document.querySelector('#device-id');
      const licenseType = document.querySelector('#license-type');
      const licenseDuration = document.querySelector('#license-duration');
      const customDaysField = document.querySelector('#custom-days-field');
      const customDays = document.querySelector('#custom-days');
      const expiresAt = document.querySelector('#expires-at');
      const generateButton = document.querySelector('#generate-button');
      const message = document.querySelector('#message');
      const result = document.querySelector('#result');
      const activationKey = document.querySelector('#activation-key');
      const expiryNote = document.querySelector('#expiry-note');
      const copyButton = document.querySelector('#copy-button');
      const copyDetailsButton = document.querySelector('#copy-details-button');
      let licenseDetails = '';

      function formatDate(date) {
        if (Number.isNaN(date.getTime())) return '';
        const year = date.getUTCFullYear();
        const month = String(date.getUTCMonth() + 1).padStart(2, '0');
        const day = String(date.getUTCDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function addMonths(date, months) {
        const result = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), 1));
        result.setUTCMonth(result.getUTCMonth() + months);
        const lastDay = new Date(Date.UTC(result.getUTCFullYear(), result.getUTCMonth() + 1, 0)).getUTCDate();
        result.setUTCDate(Math.min(date.getUTCDate(), lastDay));
        return result;
      }

      function updateExpiryDate() {
        const today = new Date();
        today.setUTCHours(0, 0, 0, 0);
        let expiryDate;

        switch (licenseDuration.value) {
          case '1-day':
            expiryDate = new Date(today);
            expiryDate.setUTCDate(expiryDate.getUTCDate() + 1);
            break;
          case '3-months':
            expiryDate = addMonths(today, 3);
            break;
          case '6-months':
            expiryDate = addMonths(today, 6);
            break;
          case '1-year':
            expiryDate = addMonths(today, 12);
            break;
          case 'custom-days': {
            const days = Number(customDays.value);
            customDaysField.hidden = false;
            customDays.required = true;
            if (!Number.isSafeInteger(days) || days < 1) {
              expiresAt.value = '';
              return;
            }
            expiryDate = new Date(today);
            expiryDate.setUTCDate(expiryDate.getUTCDate() + days);
            break;
          }
          default:
            expiresAt.value = '';
            return;
        }

        if (licenseDuration.value !== 'custom-days') {
          customDaysField.hidden = true;
          customDays.required = false;
        }
        expiresAt.value = formatDate(expiryDate);
      }

      licenseDuration.addEventListener('change', updateExpiryDate);
      customDays.addEventListener('input', updateExpiryDate);
      updateExpiryDate();

      form.addEventListener('submit', async event => {
        event.preventDefault();
        message.hidden = true;
        result.hidden = true;
        generateButton.disabled = true;
        generateButton.textContent = 'Generating Secure Key...';

        try {
          const response = await fetch('/api/licenses', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${adminToken.value}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              issuedTo: issuedTo.value.trim(),
              contact: contact.value.trim(),
              deviceId: deviceId.value.trim(),
              expiresAt: expiresAt.value,
              licenseType: licenseType.value
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || `Request failed (${response.status}).`);
          activationKey.value = data.activationKey;
          const issuedDate = new Date(data.issuedAt);
          const details = [
            `25-Digit License Key: ${data.activationKey}`,
            `Action: ${data.licenseType === 'renewal' ? 'Renewal' : 'New activation'}`,
            `Issued To: ${data.issuedTo}`,
            data.contact ? `Contact: ${data.contact}` : null,
            `Hardware Terminal ID: ${data.deviceId}`,
            `Generated: ${issuedDate.toLocaleString()}`,
            `Expires: ${data.expiresAt}`,
            `Protection: Machine Locked & Anti-Clock Rollback Protected`
          ].filter(Boolean);
          licenseDetails = details.join('\n');
          expiryNote.textContent = licenseDetails;
          result.hidden = false;
          message.textContent = 'Key generated successfully! Provide the 25-digit key above to the customer.';
          message.className = 'message success';
          message.hidden = false;
        } catch (error) {
          message.textContent = error instanceof TypeError
            ? 'Cannot reach the license server. Confirm the Node.js backend is running and open this page from its HTTPS address.'
            : error.message || 'Could not create the activation key.';
          message.className = 'message';
          message.hidden = false;
        } finally {
          generateButton.disabled = false;
          generateButton.textContent = 'Generate 25-Digit License Key';
        }
      });

      copyDetailsButton.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(licenseDetails);
          message.textContent = 'Full license summary copied to clipboard.';
          message.className = 'message success';
        } catch (error) {
          console.error('Could not copy details:', error);
          message.textContent = 'Select and copy the details from the box above.';
          message.className = 'message';
        }
        message.hidden = false;
      });

      copyButton.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(activationKey.value);
          message.textContent = '25-Digit Key copied to clipboard.';
          message.className = 'message success';
        } catch (error) {
          console.error('Could not copy key:', error);
          activationKey.focus();
          activationKey.select();
          message.textContent = 'Select and copy the key above.';
          message.className = 'message';
        }
        message.hidden = false;
      });
    </script>
  </body>
</html>
